plan_id: organic-articles-43-batch-001
plan_name: "Organic — 43 Articles Batch Production (HUB Extensions + HUB-12..16)"
approval_tier: T1
created: 2026-05-17
author: organic-team
shopify_writes: NONE
commits: OPTIONAL

description: >
  ייצור 43 מאמרים מקומית בלבד — ללא Shopify writes, ללא publish.
  שני חלקים:
    PART-1: 8 מאמרים להשלמת HUBs קיימים (HUB-1 C5-C6, HUB-2 C6, HUB-3 C5-C6, HUB-4 C5, HUB-7 C6, HUB-8 C6).
    PART-2: 35 מאמרים ב-5 HUBs חדשים (HUB-12 נעלי אורות, HUB-13 נעלי מים, HUB-14 מנשא בד, HUB-15 משאבות חלב, HUB-16 קרוקס).
  publish יתבצע אוטומטית ע"י PUBLISH-GATE בימי ראשון + רביעי כשה-API פתוח.

blocked_until:
  - production_complete: ALL_QA_PASS
  - publish_gate_trigger: "ראשון/רביעי 09:00 + GET /shop.json = 200"

telegram_notify:
  start: true
  milestones: true
  done: true
  blocked: true
  questions: false

qa_contract:
  checks_per_article: 8
  criteria:
    1: "אין inline styles (style=)"
    2: "אין hero ב-body_html"
    3: "אין video embed"
    4: "מינימום 2 תמונות CDN Shopify"
    5: "מינימום 2 internal links"
    6: "קיים product bridge (לפחות קישור מוצר 1)"
    7: "עברית תקינה — אין ערבוב שפות חסר הגיון"
    8: "FAQ קיים — 5-7 שאלות"

article_production_standard:
  seo_title_max: 60
  meta_description_range: "150-160 תווים"
  body_word_count: "1200-2000 מילה"
  slug_format: "kebab-case, עברית מתועתקת + אנגלית מקובל"
  internal_links_min: 2
  product_links_min: 1
  faq_questions: "5-7"
  images_min: 2
  blog_id: 109164036409
  blog_url: "https://babymania-il.com/blogs/news"

publish_order_rule: "Pillar → C1 → C2 → C3 → C4 → C5 → C6"

