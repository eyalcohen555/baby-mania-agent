      בכל trigger: בדוק תנאים → אם עברו → publish ראשון HUB מהpacket
      publish לפי batch_size: 7 מאמרים (HUB שלם) בכל הרצה
      לאחר כל HUB: שלח Telegram — "HUB-XX PUBLISHED: N articles LIVE"
      GSC manual request: לאחר כל HUB — הנחה לאייל ל-URL checklist
    files_allowed:
      - output/organic/master-publish-packet-43.md
      - teams/organic/hub-registry.json
    files_forbidden:
      - .env (קרא עם load_dotenv בלבד)
    expected_output: |
      GATE_STATUS: BLOCKED / OPEN
      API_STATUS: 200 / 403
      PACKET_EXISTS: YES / NO
      ARTICLES_IN_PACKET: 43 / N
      AYAL_APPROVED: YES / NO
      NEXT_BATCH: HUB-16 (קרוקס)
    exit_conditions:
      - "כל 3 תנאים מתקיימים"
      - "batch publish הצליח"
    fail_conditions:
      - "publish ללא gate פתוח"
      - "API != 200"
    next_on_pass: PUBLISH-DONE
    next_on_fail: HOLD
    is_milestone: true

  - id: PUBLISH-DONE
    name: "POST-PUBLISH VERIFY + GSC CHECKLIST"
    type: AUDIT
    approval_tier: T0
    goal: "אימות publish + הכנת GSC checklist לאייל"
    action: >
      לאחר כל HUB שפורסם:
        בדוק HTTP 200 לכל URL (7 checks)
        עדכן hub-registry.json: status=published, article_ids, published_at
        עדכן internal_content_map.json: status=published
        שלח Telegram:
          "✓ HUB-XX LIVE: [שם HUB]
           URLs: [רשימה]
           GSC checklist:
           1. פתח GSC → URL Inspection
           2. בקש אינדוקס לכל URL
           הבא: [HUB הבא] — ראשון/רביעי הקרוב"
    files_allowed:
      - teams/organic/hub-registry.json
      - output/site-map/internal_content_map.json
      - output/organic/
    files_forbidden:
      - .env
    expected_output: |
      HTTP_VERIFIED: 7/7
      REGISTRY_UPDATED: YES
      TELEGRAM_SENT: YES
    exit_conditions:
      - "HTTP_VERIFIED=7/7"
      - "REGISTRY_UPDATED=YES"
    fail_conditions:
      - "HTTP_VERIFIED < 7/7"
      - "REGISTRY_UPDATED=NO"
    next_on_pass: DONE
    next_on_fail: MANUAL_INTERVENTION
    is_milestone: false

